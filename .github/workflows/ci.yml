name: Test UndoCI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m "not docker" --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: test-results.xml
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UNDOCI_DOCKER_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: pytest -m docker -v --basetemp=.undoci/docker-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-evidence
          path: .undoci/docker-tests/
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: undoci demo /tmp/undoci-smoke --scenario safe
      - run: undoci run /tmp/undoci-smoke/undoci.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
