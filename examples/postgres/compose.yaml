services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: undoci
      POSTGRES_PASSWORD: disposable-test-password
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U undoci -d orders"]
      interval: 1s
      timeout: 3s
      retries: 40
  api:
    image: ${UNDOCI_IMAGE}
    environment:
      DATABASE_URL: postgresql://undoci:disposable-test-password@db:5432/orders
    depends_on:
      db:
        condition: service_healthy
volumes:
  database:
